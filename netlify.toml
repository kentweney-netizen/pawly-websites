[build]
  command = "python3 dapp/unpack-adopt-pets.py && python3 dapp/unpack-pixel-pets.py && python3 dapp/unpack-street-world.py && python3 dapp/patch-pethub-v0226-street.py && python3 dapp/patch-pethub-game-door.py && cd dapp && npm install --legacy-peer-deps && NODE_OPTIONS=--max-old-space-size=4096 npm run build"
  publish = "."

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
