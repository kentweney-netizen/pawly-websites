[build]
  command = "cd dapp && npm install --legacy-peer-deps && NODE_OPTIONS=--max-old-space-size=4096 npm run build"
  publish = "."

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"

# —— 域名统一 ——
[[redirects]]
  from = "http://pawlypets.online/*"
  to = "https://www.pawlypets.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pawlypets.online/*"
  to = "https://www.pawlypets.online/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://pawlypets.online/*"
  to = "https://www.pawlypets.online/:splat"
  status = 301
  force = true

# —— dApp 静态资源（必须写在 SPA catch-all 之前，否则 logo/manifest 会变成 HTML）——
[[redirects]]
  from = "/dapp/assets/*"
  to = "/dapp/dist/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/manifest.json"
  to = "/dapp/dist/manifest.json"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pawly-token-helps.png"
  to = "/dapp/dist/pawly-token-helps.png"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pawly-token-helps2.jpg"
  to = "/dapp/dist/pawly-token-helps2.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pawly-token-helps-180.png"
  to = "/dapp/dist/pawly-token-helps-180.png"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pet-hub-street.jpg"
  to = "/dapp/dist/pet-hub-street.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pet-hub-hospital.jpg"
  to = "/dapp/dist/pet-hub-hospital.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pet-hub-park.jpg"
  to = "/dapp/dist/pet-hub-park.jpg"
  status = 200
  force = true

# 兼容旧路径（若缓存仍请求旧 logo 文件名）
[[redirects]]
  from = "/dapp/pawly-logo-192.png"
  to = "/dapp/dist/pawly-token-helps.png"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pawly-logo-512.png"
  to = "/dapp/dist/pawly-token-helps2.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/pawly-logo-180.png"
  to = "/dapp/dist/pawly-token-helps.png"
  status = 200
  force = true

# —— dApp SPA（最后才 catch-all）——
[[redirects]]
  from = "/dapp"
  to = "/dapp/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/"
  to = "/dapp/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/dapp/*"
  to = "/dapp/dist/index.html"
  status = 200
  force = true
