name: patch-pethub-cert-download
on:
  workflow_dispatch:
  push:
    paths:
      - dapp/patch-pethub-cert-download.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 dapp/patch-pethub-cert-download.py
      - run: |
          git config user.name kentweney-netizen
          git config user.email kentweney@gmail.com
          git add dapp/src/petHub.tsx
          git diff --cached --quiet && exit 0
          git commit -m "v0.10.2 cert/photo download in Pet Hub, no Resend"
          git push origin HEAD:main
