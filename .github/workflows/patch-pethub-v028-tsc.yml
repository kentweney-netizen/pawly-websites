name: patch-pethub-v028-tsc
on:
  workflow_dispatch:
  push:
    paths:
      - dapp/patch-pethub-v028-tsc.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 dapp/patch-pethub-v028-tsc.py
      - run: |
          git config user.name kentweney-netizen
          git config user.email kentweney@gmail.com
          git add dapp/src/petHub.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix v0.2.8 tsc Buffer + pack.transactions"
          git push origin HEAD:main
