name: patch-pethub-v028
on:
  workflow_dispatch:
  push:
    paths:
      - dapp/patch-pethub-v028-client-raydium.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 dapp/patch-pethub-v028-client-raydium.py
      - run: |
          git config user.name kentweney-netizen
          git config user.email kentweney@gmail.com
          git add dapp/src/petHub.tsx
          git diff --cached --quiet && exit 0
          git commit -m "v0.2.8 in-hub Raydium swap then PAWLY to till"
          git push origin HEAD:main
