name: patch-pethub-lv-label
on:
  workflow_dispatch:
  push:
    paths:
      - dapp/patch-pethub-lv-label.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 dapp/patch-pethub-lv-label.py
      - run: |
          git config user.name kentweney-netizen
          git config user.email kentweney@gmail.com
          git add dapp/src/petHub.tsx
          git diff --cached --quiet && exit 0
          git commit -m "v0.10.4 street shows Lv and feeds to next body"
          git push origin HEAD:main
