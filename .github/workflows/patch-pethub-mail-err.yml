name: patch-pethub-mail-err
on:
  workflow_dispatch:
  push:
    paths:
      - dapp/patch-pethub-mail-err.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 dapp/patch-pethub-mail-err.py
      - run: |
          git config user.name kentweney-netizen
          git config user.email kentweney@gmail.com
          git add dapp/src/petHub.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Pet Hub mail: show Resend error + download cert/photo"
          git push origin HEAD:main
