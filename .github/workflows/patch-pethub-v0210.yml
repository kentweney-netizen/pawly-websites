name: patch-pethub-v0210
on:
  workflow_dispatch:
  push:
    paths:
      - dapp/patch-pethub-v0210-extract-tx.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 dapp/patch-pethub-v0210-extract-tx.py
      - run: |
          git config user.name kentweney-netizen
          git config user.email kentweney@gmail.com
          git add dapp/src/petHub.tsx
          git diff --cached --quiet && exit 0
          git commit -m "v0.2.10 extract Raydium data[] + SOL wrapSol"
          git push origin HEAD:main
